[[question]]
name = "diff coverage"
directives = true
trigger = "code:source"

[[question]]
name = "test count did not fall"
trigger = "code:source"

[[question]]
name = "changed tests run"
trigger = "code:source"

[[question]]
name = "changed-code mutation"
directives = true
trigger = "life:depended-on"

[[question]]
name = "full mutation"
directives = true
trigger = "life:depended-on"

[[question]]
name = "static security analysis"
trigger = "code:source"

[[question]]
name = "changed tests order-independent"
trigger = "code:source"

[[question]]
name = "suite order-independent and repeatable"
trigger = "code:source"

[[question]]
name = "type coverage, ratcheted"
directives = true
trigger = "code:source"

[[question]]
name = "dependency direction"
trigger = "code:layer"

[[question]]
name = "shipped-dependency audit"
trigger = "code:dependency"

[[question]]
name = "public surface changed on purpose"
