[types]
service = "answers requests over a network: an HTTP or gRPC API, a web backend"
web-ui = "runs in a browser"
app = "an installed client with a user interface: mobile, desktop"
cli = "a command a person or a script runs"
job = "runs unattended on a schedule, a queue or a stream: a worker, a batch, a pipeline"
library = "code other code imports; nothing to boot"

[kinds]
source = "a module of the project's own logic"
entry-point = "a route, command, job handler or screen a user or caller reaches"
listener = "a process that keeps running to serve: a server, a worker loop, a consumer"
outbound-call = "a call across the network to something the project does not run"
config-read = "a read of a setting from the environment or a configuration file"
stored-format = "a schema, migration or file format the project writes and reads back later"
public-interface = "an exported symbol, a published route or schema others build against"
untrusted-input = "a parser or decoder of bytes from outside the process"
user-interface = "a page, screen or component a person sees"
container = "a container image or infrastructure file the deliverable ships in"
dependency = "a third-party package the deliverable ships with"
concurrency = "threads, shared memory, unsafe code or a lock"
doc-example = "a code example in the documentation"
flag = "a feature flag in flags.toml"
layer = "a declared part in the binding's Architecture section"
formal-model = "a formal model or proof the project keeps"
state-machine = "a fixed set of named states that something moves between: a status, a phase, a lifecycle, the steps of a protocol"
scheduled-work = "work a clock starts rather than a caller: a timer, a recurring task, a schedule entry"
access-control = "a check of who is acting or what they may see or do: a sign-in, a session, a role"

[architecture]
"code:stored-format" = "the project now keeps data: where it lives, which part alone reads and writes it, and how its shape changes without losing what is kept"
"code:listener" = "a process now keeps running to serve: what starts and stops it, and how the other parts reach it"
"code:outbound-call" = "the project now depends on a system it does not run: which part alone talks to it, and what the project does when it is slow, wrong or gone"
"code:user-interface" = "a screen now exists where there was none: which part draws it, which part holds the rules, and how the two talk"
"code:scheduled-work" = "a clock now starts work: where that work runs, and what happens when a run overlaps, fails or is missed"
"code:access-control" = "more than one person now acts in it: whose data each may see or change, and the one place that rule is held"
"code:concurrency" = "parts now run at once: what they share, who may change it, and how they hand work to each other"
"life:deployed" = "others can now reach it: where it runs, how it is configured there, and how a bad release is undone"
"life:irreplaceable-data" = "it now holds data that cannot be recreated: where that data lives, how it is copied, and how it is restored"
"life:depended-on" = "people now rely on it: which of its surfaces are promises, and how they change without breaking anyone"

[events.deployed]
meaning = "it runs somewhere people other than the owner can reach"
in-binding = true

[events.irreplaceable-data]
meaning = "it holds data the owner could not recreate: users' records, uploads, payments"
in-binding = true

[events.depended-on]
meaning = "people outside the project rely on it: users, customers, other teams"
signs = ["CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md"]

[[documents]]
name = "instructions"
paths = ["AGENTS.md", "**/AGENTS.md"]
lifetime = "standing"
prune = "never"

[[documents]]
name = "binding"
paths = ["docs/process/**"]
lifetime = "standing"
prune = "never"

[[documents]]
name = "tracker setup"
paths = ["docs/agents/**"]
lifetime = "standing"
prune = "never"

[[documents]]
name = "glossary"
paths = ["GLOSSARY.md", "GLOSSARY-MAP.md"]
lifetime = "standing"
prune = "never"

[[documents]]
name = "decision"
paths = ["docs/adr/*.md"]
lifetime = "standing"
prune = "never"

[[documents]]
name = "dispute"
paths = ["docs/disputes/*.md"]
lifetime = "standing"
prune = "never"

[[documents]]
name = "incident"
paths = ["docs/incidents/*.md"]
lifetime = "standing"
prune = "never"

[[documents]]
name = "product and design"
paths = ["PRODUCT.md", "DESIGN.md"]
lifetime = "standing"
prune = "never"

[[documents]]
name = "brief"
paths = ["docs/design-brief.md"]
lifetime = "standing"
prune = "pass"
keeps = ["## Purpose", "## In the owner's words", "## Explicitly out of slice one", "## Slice one", "## Explicitly out"]

[[documents]]
name = "readme"
paths = ["README.md", "**/README.md"]
lifetime = "standing"
prune = "pass"

[[documents]]
name = "change description"
paths = [".scratch/changes/*.md"]
lifetime = "standing"
prune = "never"

[[documents]]
name = "local feature"
paths = [".scratch/*/spec.md", ".scratch/*/issues/*.md"]
lifetime = "steering"
prune = "none"

[[documents]]
name = "feature spec"
paths = ["docs/features/*/spec.md"]
lifetime = "steering"
prune = "none"

[proofs]
outside-the-seam = "an entry point registered outside the instrumented seam, which emits nothing"
broken-flag-state = "a flag whose on state breaks a test that its off state passes"
erroring-route = "a route the smoke requests that answers with an error"
guarded-crash = "a crash reached only when the input holds an exact value of four bytes or more that the parser compares against"
related-fields = "a crash reached only when two fields of the input satisfy an arithmetic relation, such as one equal to the sum of the others"
prose-comment = "a prose comment in a file of a `listed` row of the binding's Comments table"
doc-comment = "a doc comment in a file outside the published interface"
forced-colors = "an element that loses its visible border, outline, or contrast under emulated forced-colors mode"
reduced-motion = "an animation or transition that remains active under emulated reduced-motion preference"
code-departs-from-model = "a change to the code the model mirrors that breaks a property the model holds, with the model left as it was"

[[question]]
name = "lint, near-all rules"
directives = true

[[question]]
name = "strict types"
directives = true

[[question]]
name = "no prose comments"
proofs = ["prose-comment", "doc-comment"]

[[question]]
name = "unit, property and fitness tests"
directives = true
trigger = "code:source"
collection = true

[[question]]
name = "contract drift"
trigger = "code:public-interface"
applies-to = ["service"]

[[question]]
name = "starts and answers"
trigger = "code:entry-point"
applies-to = ["service", "web-ui", "app", "cli", "job"]

[[question]]
name = "telemetry emitted"
trigger = "code:entry-point"
applies-to = ["service", "web-ui", "app", "job"]
collection = true
proofs = ["outside-the-seam"]

[[question]]
name = "changed flags off and on"
trigger = "code:flag"
applies-to = ["service", "web-ui", "app", "cli", "job"]
proofs = ["broken-flag-state"]

[[question]]
name = "load smoke"
trigger = "code:entry-point"
applies-to = ["service", "job"]
proofs = ["erroring-route"]

[[question]]
name = "documentation examples run"
trigger = "code:doc-example"
collection = true

[[question]]
name = "deep interface conformance"
trigger = "code:public-interface"
applies-to = ["service", "library"]

[[question]]
name = "fuzzing"
trigger = "code:untrusted-input"
collection = true
proofs = ["guarded-crash"]

[[question]]
name = "end to end"
trigger = "life:deployed"
applies-to = ["service", "web-ui", "app", "cli", "job"]
collection = true

[[question]]
name = "performance budget"
trigger = "life:depended-on"
collection = true

[[question]]
name = "dynamic security scan"
trigger = "life:deployed"
applies-to = ["service", "web-ui"]

[[question]]
name = "active security scan"
trigger = "life:deployed"
applies-to = ["service", "web-ui"]

[[question]]
name = "load"
trigger = "life:depended-on"
applies-to = ["service", "job"]
collection = true

[[question]]
name = "telemetry arrives"
trigger = "life:deployed"
applies-to = ["service", "web-ui", "app", "job"]

[[question]]
name = "accessibility"
trigger = "code:user-interface"
applies-to = ["web-ui", "app"]
