# Application types (Ratchet method): which questions the method asks of which kind of software.
# A type decides which questions apply. It never decides which tool answers one: the binding does.
# `scripts/application_types.py` reads this file for the conformance gate, and the adopt skill
# reads it to propose the binding. tiers.md explains it; this file is the single source.
#
# A binding declares its types on one line: `- Application types: service, web-ui`.
# A question applies to a repository when it applies to any type the binding declares.
#   - A row that applies names a tool, or `none` with a reason and the ADR that accepts the gap.
#   - A row that does not apply may say `none: not a <type>`, naming a type the question is asked
#     of, and needs no ADR.
#   - The row itself always stays in the binding's Gates table.

[types]
service = "answers requests over a network: an HTTP or gRPC API, a web backend"
web-ui = "runs in a browser"
app = "an installed client with a user interface: mobile, desktop"
cli = "a command a person or a script runs"
job = "runs unattended on a schedule, a queue or a stream: a worker, a batch, a pipeline"
library = "code other code imports; nothing to boot"

# When a question is asked (ADR 0028). Every question carries a trigger; a row whose trigger has
# not fired is bound `later: <trigger>` and judges nothing.
#   always           the floor: no setup, seconds to run, asked from the first commit
#   code:<kind>      asked once the first instance of a kind of code exists; the binding's
#                    `## Triggers` table says what marks an instance in this stack. The change that
#                    brings the first instance is free; a later one that adds another while a row
#                    is still owed is red.
#   life:<event>     asked once the owner declares the event on the binding's `- Life events:`
#                    line; the route proposes it when it sees one of its signs.

# The kinds of code a trigger can name. The text is what the binding's Triggers row must match.
[kinds]
source = "a module of the project's own logic"
entry-point = "a route, command, job handler or screen a user or caller reaches"
listener = "a process that keeps running to serve: a server, a worker loop, a consumer"
outbound-call = "a call across the network to something the project does not run"
config-read = "a read of a setting from the environment or a configuration file"
stored-format = "a schema, migration or file format the project writes and reads back later"
public-interface = "an exported symbol, a published route or schema others build against"
untrusted-input = "a parser or decoder of bytes from outside the process"
user-interface = "a page, screen or component a person sees"
container = "a container image or infrastructure file the deliverable ships in"
dependency = "a third-party package the deliverable ships with"
concurrency = "threads, shared memory, unsafe code or a lock"
doc-example = "a code example in the documentation"
flag = "a feature flag in flags.toml"
layer = "a declared layer in AGENTS.md"
formal-model = "a formal model or proof the project keeps"

# The events in a project's life a trigger can name, and the signs the route reads to propose one.
# `signs` are globs over the tree; the owner declares the event, never the route.
[events.deployed]
meaning = "it runs somewhere people other than the owner can reach"
signs = ["fly.toml", "render.yaml", "vercel.json", "netlify.toml", "wrangler.toml", "Procfile", "app.yaml", "railway.json", ".github/workflows/*deploy*", "k8s/**", "deploy/**"]

[events.irreplaceable-data]
meaning = "it holds data the owner could not recreate: users' records, uploads, payments"
signs = ["migrations/**", "**/migrations/**", "prisma/schema.prisma", "alembic.ini", "**/schema.sql"]

[events.depended-on]
meaning = "people outside the project rely on it: users, customers, other teams"
signs = []

# One [[question]] per question this file says something about. A question it does not list
# applies to all six types, judges no collection and is asked always.
#   name        the question, as the binding's Gates table spells it
#   applies-to  the types the question is asked of; absent means all six
#   trigger     when it is asked: `always` (the default), `code:<kind>` or `life:<event>`
#   collection  true when the gate judges a set of things the project writes (tests, benchmarks,
#               fuzz targets, scenarios). Such a gate is red when the set is empty, and the
#               repository proves it: a `remove` bite in `quality/bites.toml` empties the set
#               and its `bite-all` entry point expects red.
#   proofs      the named proofs the question requires of a gate bound to it, beyond one fault of
#               the repository's choosing. `[proofs]` below says what each one plants. A `[[bite]]`
#               of `quality/bites.toml` claims one with `proof = "<name>"`, and the conformance
#               gate is red while a bound row lacks a bite for a proof its question requires.

# A proof is a fault that only this question's gate can catch, named so its absence is seen.
# The name says what to plant, in the words of the concept; the repository writes the fault.
[proofs]
outside-the-seam = "an entry point registered outside the instrumented seam, which emits nothing"
broken-flag-state = "a flag whose on state breaks a test that its off state passes"
erroring-route = "a route the smoke requests that answers with an error"

[[question]]
name = "unit, property and fitness tests"
trigger = "code:source"
collection = true

[[question]]
name = "contract drift"
trigger = "code:public-interface"
applies-to = ["service"]

[[question]]
name = "starts and answers"
trigger = "code:entry-point"
applies-to = ["service", "web-ui", "app", "cli", "job"]

[[question]]
name = "telemetry emitted"
trigger = "code:entry-point"
applies-to = ["service", "web-ui", "app", "job"]
collection = true
proofs = ["outside-the-seam"]

[[question]]
name = "changed flags off and on"
trigger = "code:flag"
applies-to = ["service", "web-ui", "app", "cli", "job"]
proofs = ["broken-flag-state"]

[[question]]
name = "load smoke"
trigger = "code:entry-point"
applies-to = ["service", "job"]
proofs = ["erroring-route"]

[[question]]
name = "documentation examples run"
trigger = "code:doc-example"
collection = true

[[question]]
name = "deep interface conformance"
trigger = "code:public-interface"
applies-to = ["service", "library"]

[[question]]
name = "fuzzing"
trigger = "code:untrusted-input"
collection = true

[[question]]
name = "end to end"
trigger = "code:entry-point"
applies-to = ["service", "web-ui", "app", "cli", "job"]
collection = true

[[question]]
name = "performance budget"
trigger = "life:depended-on"
collection = true

[[question]]
name = "dynamic security scan"
trigger = "life:deployed"
applies-to = ["service", "web-ui"]

[[question]]
name = "active security scan"
trigger = "life:deployed"
applies-to = ["service", "web-ui"]

# The weekly `load-soak` entry point follows this row: where `load` does not apply, neither does it.
