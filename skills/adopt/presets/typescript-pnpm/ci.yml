# typescript-pnpm preset: the toolchain steps and cache lines adopt merges into every job of
# ci.yml and deep.yml. `steps` replace the `# bind: toolchain setup` comment; `cache` replaces the
# template's `path:` and `key:` lines. Every action is pinned to a commit with its version beside
# it; pnpm's own version comes from `packageManager` in package.json. The plugin's gates and
# diff-cover need python3 (3.11 or later), which ubuntu-latest carries.
steps:
  - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
  - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
    with:
      node-version-file: .nvmrc
      cache: pnpm
  - run: pnpm install --frozen-lockfile
cache:
  path: |
    node_modules/.cache
    .eslintcache
    .stryker-tmp
  key: ${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('package.json', 'tsconfig.json') }}
