# python-uv preset: tool stanzas adopt appends to the project's pyproject.toml. The dev group
# names every gate tool so uv.lock pins them; adopt keeps versions the project already has.

[dependency-groups]
dev = [
    "bandit>=1.8",
    "crosshair-tool>=0.0.80",
    "deptry>=0.21",
    "diff-cover>=9.2",
    "griffe>=1.5",
    "hypothesis>=6.115",
    "import-linter>=2.1",
    "interrogate>=1.7",
    "mutmut>=3.2",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pip-licenses>=5.0",
    "pylint>=3.3",
    "pytest>=8.3",
    "pytest-benchmark>=5.1",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "radon>=6.0",
    "ruff>=0.8",
    "vulture>=2.13",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # one-blank-line-before-class: conflicts with D211
    "D213",   # multi-line-summary-second-line: conflicts with D212
    "COM812", # missing-trailing-comma: the formatter owns commas
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D100", "D101", "D102", "D103", "D104"]

[tool.ruff.lint.mccabe]
max-complexity = 10 # C901; the binding's Limits

[tool.ruff.lint.pylint]
max-branches = 12        # PLR0912
max-args = 5             # PLR0913
max-positional-args = 3  # PLR0917
max-statements = 40      # PLR0915

[tool.mypy]
files = ["src", "tests"]
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "truthy-bool", "redundant-expr"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config -p no:cacheprovider"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]
markers = ["fuzz: long hypothesis runs under the fuzz profile"]

[tool.coverage.run]
branch = true
source = ["src", "tests/fitness"]

[tool.coverage.report]
show_missing = true
# No `exclude_lines` and no `omit`: the coverage gate forbids exclusions on absolute paths and
# fails any measured file outside a declared group.

[tool.bandit]
exclude_dirs = ["tests"]

[tool.importlinter]
root_packages = ["<package>"]
# bind: one contract per Layers row, e.g.
# [[tool.importlinter.contracts]]
# name = "core imports nothing above it"
# type = "layers"
# layers = ["<package>.app", "<package>.core"]

[tool.mutmut]
paths_to_mutate = ["src/"]
tests_dir = ["tests/"]

[tool.interrogate]
fail-under = 0
exclude = ["tests"]
