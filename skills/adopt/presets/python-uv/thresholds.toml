# python-uv preset: appended to quality/thresholds.toml. The core group is absolute; the others
# start at 0 and `just ratchet` raises them to the first measured values.

[python.coverage.core]
paths = ["src/*/core/**", "tests/fitness/**"]
absolute = true

[python.coverage.app]
paths = ["src/**"]
line = 0.0
branch = 0.0

[python.coverage.tests]
paths = ["tests/**", "tools/**"]
line = 0.0
branch = 0.0

[python.mutation]
score = 0.0

[python.docs]
coverage = 0.0

[ceilings.change]
files = 40
lines = 1500
