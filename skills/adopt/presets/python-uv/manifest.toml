# python-uv preset: paths adopt appends to the template manifest's groups of the same name,
# in place of each group's `# bind:` comment.

[[group]]
name = "tool-config"
paths = [
    "pyproject.toml",
    "uv.lock",
    ".importlinter",
    "mypy.ini",
    "ruff.toml",
]

[[group]]
name = "fitness"
paths = [
    "tests/fitness/**",
]

[[group]]
name = "gate-tools"
paths = [
    "tools/gates/**",
]
