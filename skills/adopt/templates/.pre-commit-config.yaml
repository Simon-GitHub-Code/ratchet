default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: tier0-tree
        name: tier 0, the tree
        entry: just pre-commit
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
      - id: tier0-subject
        name: tier 0, the subject
        entry: just commit-msg
        language: system
        stages: [commit-msg]
        always_run: true
