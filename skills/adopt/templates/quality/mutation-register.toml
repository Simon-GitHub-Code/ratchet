# Mutation register (Ratchet method). Every surviving mutant is killed or listed here with a
# stable identity, a reason of twenty characters or more and the review date. An entry whose
# mutant is killed, gone or whose function hash changed is stale and fails the gate.

# [[survivor]]
# tool = "<mutation tool>"
# identity = "<mutant name>"
# function_hash = "sha256:<hash of the enclosing function>"
# reason = "<why this mutant is equivalent>"
# date = 2026-01-01
