name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Why: a superseded run of the same ref is wasted minutes; on main every run completes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  RATCHET_PLUGIN: ${{ github.workspace }}/ratchet
jobs:
  tier0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { repository: "<owner>/ratchet", ref: "<version tag>", path: ratchet } # bind: the ratchet plugin, pinned
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: | # bind: the dependency directory and every tool cache tier 0 writes
            .cache
          key: tier0-${{ runner.os }}-${{ hashFiles('**/*.lock') }}-${{ hashFiles('pyproject.toml', 'package.json') }} # bind: lockfiles and tool configs
          restore-keys: |
            tier0-${{ runner.os }}-
      # bind: toolchain setup, pinned, with the setup action's own cache on
      - run: python3 "$RATCHET_PLUGIN/scripts/budget.py" tier0 --report .ratchet/timing.jsonl -- just tier0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: timing-tier0, path: .ratchet/timing.jsonl }
  tier1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: tier0
    strategy:
      fail-fast: false
      # Why: one job per gate, so the wall clock is the slowest gate and one run shows every red.
      matrix:
        gate: [test, coverage, diff-coverage, test-counts, mutation-changed, contracts-check, audit, duplication, build, smoke, bite, api-check, data-compat, doctests, sast, artefact-scan, type-coverage, doc-coverage, change-size, guard-diff, conformance]
        # bind: shard a suite over its budget: replace its entry with include rows such as
        #   - { gate: test, shard: 1/4 }  ... and pass ${{ matrix.shard }} to the recipe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { repository: "<owner>/ratchet", ref: "<version tag>", path: ratchet } # bind: the ratchet plugin, pinned
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: | # bind: the dependency directory and every tool cache tier 1 writes
            .cache
          key: tier1-${{ runner.os }}-${{ hashFiles('**/*.lock') }}-${{ hashFiles('pyproject.toml', 'package.json') }} # bind: lockfiles and tool configs
          restore-keys: |
            tier1-${{ runner.os }}-
      # bind: toolchain setup, pinned, with the setup action's own cache on
      - run: python3 "$RATCHET_PLUGIN/scripts/budget.py" "${{ matrix.gate }}" --report .ratchet/timing.jsonl -- just "${{ matrix.gate }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: "timing-${{ matrix.gate }}", path: .ratchet/timing.jsonl }
  guard-changes-present:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { repository: "<owner>/ratchet", ref: "<version tag>", path: ratchet } # bind: the ratchet plugin, pinned
      - run: PYTHONPATH=ratchet/hooks python3 -m ratchet_guards.diff --root . --fail-if-present
