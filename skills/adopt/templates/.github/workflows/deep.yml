name: deep
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
permissions:
  contents: read
# Why: a nightly that is still running when the next starts is two nightlies; the newer one wins.
concurrency:
  group: deep-${{ github.ref }}
  cancel-in-progress: true
env:
  RATCHET_PLUGIN: ${{ github.workspace }}/ratchet
jobs:
  tier2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        gate: [mutation, api-deep, symbolic, fuzz, e2e, test-stability, reproducible, sanitizers, perf, dast, a11y, formal]
        # bind: shard full mutation by file: replace its entry with include rows such as
        #   - { gate: mutation, shard: 1/8 }  ... and pass ${{ matrix.shard }} to the recipe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { repository: Simon-GitHub-Code/ratchet, ref: "<ratchet-sha>", path: ratchet } # the plugin at the commit ADR 0001 names; adopt step 10 fills it
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: | # bind: the dependency directory, the mutation cache, the fuzz corpus
            .cache
          key: tier2-${{ runner.os }}-${{ hashFiles('**/*.lock') }}-${{ hashFiles('pyproject.toml', 'package.json') }} # bind: lockfiles and tool configs
          restore-keys: |
            tier2-${{ runner.os }}-
      # bind: toolchain setup, pinned, with the setup action's own cache on
      - run: python3 "$RATCHET_PLUGIN/scripts/budget.py" "${{ matrix.gate }}" --report .ratchet/timing.jsonl -- just "${{ matrix.gate }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: "timing-${{ matrix.gate }}", path: .ratchet/timing.jsonl }
