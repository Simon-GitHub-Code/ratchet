name: deep
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
permissions:
  contents: read
# Why: a nightly that is still running when the next starts is two nightlies; the newer one wins.
concurrency:
  group: deep-${{ github.ref }}
  cancel-in-progress: true
env:
  RATCHET_PLUGIN: ${{ github.workspace }}/ratchet
jobs:
  # Why: the gates of a tier are the lists at the top of the `justfile`, the lists a local run is
  # built from, and this job turns them into matrices: adding a gate is one word there and never a
  # change to this file. The long gates run as one job per shard, and the count is the binding's
  # `- Shards:` line, 1 on day one. Adding runners is that one number.
  shape:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      shards: ${{ steps.shards.outputs.list }}
      count: ${{ steps.shards.outputs.count }}
      tier2: ${{ steps.shards.outputs.tier2 }}
      tier2_long: ${{ steps.shards.outputs.tier2_long }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { sparse-checkout: "justfile\ndocs/process/binding.md", sparse-checkout-cone-mode: false }
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - id: shards
        run: |
          count="$(sed -n 's/^- Shards: *\([1-9][0-9]*\) *$/\1/p' docs/process/binding.md)"
          if [ -z "$count" ]; then echo "docs/process/binding.md: no '- Shards: N' line"; exit 1; fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "list=[$(seq -s, 1 "$count")]" >> "$GITHUB_OUTPUT"
          json() { out=""; for item in $1; do out="$out,\"$item\""; done; echo "[${out#,}]"; }
          long="$(just --evaluate tier2_sharded)"; short=""
          for gate in $(just --evaluate tier2_gates); do
            case " $long " in *" $gate "*) ;; *) short="$short $gate" ;; esac
          done
          echo "tier2=$(json "$short")" >> "$GITHUB_OUTPUT"
          echo "tier2_long=$(json "$long")" >> "$GITHUB_OUTPUT"
  tier2:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: shape
    strategy:
      fail-fast: false
      # Why: one job per gate, so the wall clock is the slowest gate and one run shows every red.
      matrix:
        gate: ${{ fromJSON(needs.shape.outputs.tier2) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { repository: Simon-GitHub-Code/ratchet, ref: "<ratchet-sha>", path: ratchet } # the plugin at the commit ADR 0001 names; adopt fills it
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: | # bind: the dependency directory, the mutation cache, the fuzz corpus
            .cache
          key: tier2-${{ runner.os }}-${{ hashFiles('**/*.lock') }}-${{ hashFiles('pyproject.toml', 'package.json') }} # bind: lockfiles and tool configs
          restore-keys: |
            tier2-${{ runner.os }}-
      # bind: toolchain setup, pinned, with the setup action's own cache on
      - run: python3 "$RATCHET_PLUGIN/scripts/budget.py" "${{ matrix.gate }}" --report .ratchet/timing.jsonl -- just "${{ matrix.gate }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: "timing-${{ matrix.gate }}", path: .ratchet/timing.jsonl }
  # Why: a matrix with no values is an error GitHub raises before the job exists, so a project with
  # no long gate (an empty `*_sharded` list in the `justfile`) skips the job instead.
  tier2-long:
    if: needs.shape.outputs.tier2_long != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: shape
    strategy:
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.shape.outputs.tier2_long) }}
        shard: ${{ fromJSON(needs.shape.outputs.shards) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { repository: Simon-GitHub-Code/ratchet, ref: "<ratchet-sha>", path: ratchet } # the plugin at the commit ADR 0001 names; adopt fills it
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: | # bind: the dependency directory, the mutation cache, the fuzz corpus
            .cache
          key: tier2-${{ runner.os }}-${{ hashFiles('**/*.lock') }}-${{ hashFiles('pyproject.toml', 'package.json') }} # bind: lockfiles and tool configs
          restore-keys: |
            tier2-${{ runner.os }}-
      # bind: toolchain setup, pinned, with the setup action's own cache on
      - run: python3 "$RATCHET_PLUGIN/scripts/budget.py" "${{ matrix.gate }}" --report .ratchet/timing.jsonl -- just "${{ matrix.gate }}"
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.shape.outputs.count }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: "timing-${{ matrix.gate }}-${{ matrix.shard }}", path: .ratchet/timing.jsonl }
