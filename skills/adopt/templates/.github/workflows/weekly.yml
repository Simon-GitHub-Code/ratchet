name: weekly
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly
  cancel-in-progress: true
env:
  RATCHET_PLUGIN: ${{ github.workspace }}/ratchet
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { repository: Simon-GitHub-Code/ratchet, ref: "<ratchet-sha>", path: ratchet }
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache
          key: weekly-${{ runner.os }}-${{ hashFiles('**/*.lock') }}-${{ hashFiles('quality/snapshots/**') }}-${{ github.sha }}
          restore-keys: |
            weekly-${{ runner.os }}-
      - { name: "bind: toolchain setup, pinned, with the setup action's own cache on", run: exit 1 }
      - name: Run the weekly gates
        shell: bash
        run: just weekly 2>&1 | tee weekly.txt
      - name: Open or update the one issue a finding gets
        if: failure()
        run: |
          title="Weekly gates: a finding"
          {
            echo "The weekly gates were red in $RUN. Each finding gets its own pull request; close this issue when a run is green."
            echo
            echo '```'
            python3 "$RATCHET_PLUGIN/scripts/red_gates.py" weekly.txt 2>/dev/null \
              || tail -n 60 weekly.txt 2>/dev/null || echo "the run failed before the gates started"
            echo '```'
          } > finding.md
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file finding.md
          else
            gh issue create --title "$title" --body-file finding.md
          fi
