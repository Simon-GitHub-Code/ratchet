name: merge
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: merge
  cancel-in-progress: false
env:
  RATCHET_PLUGIN: ${{ github.workspace }}/ratchet
jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.path == '.github/workflows/ci.yml'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { repository: Simon-GitHub-Code/ratchet, ref: "<ratchet-sha>", path: ratchet }
      - name: Judge every green pull request, say what was found, merge what passed
        run: |
          fetch() { git fetch --no-tags -q origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" "$@"; }
          runs() { gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$1/runs" -f per_page=100 "${@:2}" || true; }
          counted() { python3 "$RATCHET_PLUGIN/scripts/forge_runs.py" "$@" --repository "$GITHUB_REPOSITORY"; }
          comment() {
            id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$1/comments" --paginate \
              --jq '.[] | select(.body | startswith("<!-- ratchet:merge -->")) | .id' | head -n 1)"
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$2" --silent
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$1/comments" -F "body=@$2" --silent
            fi
          }
          fetch
          tier1="$(runs ci.yml -f "branch=$DEFAULT_BRANCH" -f event=push -f status=completed | counted tier1 --tip "origin/$DEFAULT_BRANCH")"
          tier2="$(runs deep.yml -f "branch=$DEFAULT_BRANCH" -f status=completed | counted deep --tip "origin/$DEFAULT_BRANCH")"
          gh pr list --state open --limit 100 --json number,headRefOid,headRefName,baseRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefOid) \(.headRefName) \(.baseRefName)"' > "$RUNNER_TEMP/open.txt"
          failed=0; merged=0
          while read -r number sha branch target; do
            gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=all -f "head=${GITHUB_REPOSITORY%%/*}:$branch" -f per_page=100 > "$RUNNER_TEMP/pulls.json" || true
            gh api "repos/$GITHUB_REPOSITORY/issues/$number/events?per_page=100" --paginate > "$RUNNER_TEMP/events.json" || true
            left="$RUNNER_TEMP/left-$number.md"
            if ! ci="$(runs ci.yml -f "head_sha=$sha" -f event=pull_request | counted ci --pulls "$RUNNER_TEMP/pulls.json" \
              --events "$RUNNER_TEMP/events.json" --number "$number" --sha "$sha" --branch "$branch" --base "$DEFAULT_BRANCH" \
              --report "$left")"; then
              echo "#$number: $ci: left alone"
              if [ -s "$left" ]; then comment "$number" "$left"; echo "#$number: merge: owner"; fi
              continue
            fi
            fetch "$sha"
            report="$RUNNER_TEMP/merge-$number.md"
            verdict=owner
            if python3 "$RATCHET_PLUGIN/scripts/merge_ready.py" --base "origin/$DEFAULT_BRANCH" --head "$sha" \
              --target "$target" --current --tier1 "$tier1" --tier2 "$tier2" --report "$report"; then verdict=agent; fi
            if [ ! -s "$report" ]; then echo "#$number: the judge wrote no report"; failed=1; continue; fi
            comment "$number" "$report"
            echo "#$number: merge: $verdict"
            if [ "$verdict" = agent ]; then
              now="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '"\(.state) \(.head.sha) \(.base.ref)"' || true)"
              if [ "$now" != "open $sha $DEFAULT_BRANCH" ]; then
                echo "::error::#$number: its head or its base changed while it was judged"; failed=1
              elif closes="$(gh pr view "$number" --json closingIssuesReferences \
                  --jq '.closingIssuesReferences[] | select(.url | startswith(env.GITHUB_SERVER_URL + "/" + env.GITHUB_REPOSITORY + "/issues/")) | .number')" \
                && gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$number/merge" -f "sha=$sha" -f merge_method=merge --jq .message; then
                merged=1
                for issue in $closes; do
                  gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$issue" -f state=closed -f state_reason=completed --silent \
                    || echo "::warning::#$number: issue #$issue it closes stays open"
                done
                case "$branch" in
                  *[!A-Za-z0-9._/-]*) echo "branch $branch stays" ;;
                  *)
                    if ! above="$(gh api -X GET "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f "base=$branch" -f per_page=1 --jq '.[0].number // empty')"; then
                      echo "branch $branch stays: the forge did not say whether an open pull request targets it"
                    elif [ -n "$above" ]; then
                      echo "branch $branch stays: pull request #$above targets it"
                    else
                      gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" --silent || echo "branch $branch stays"
                    fi ;;
                esac
              else
                echo "::error::#$number: the forge refused the merge"; failed=1
              fi
            fi
          done < "$RUNNER_TEMP/open.txt"
          if [ "$merged" = 1 ]; then gh workflow run deep.yml --ref "$DEFAULT_BRANCH"; fi
          exit "$failed"
