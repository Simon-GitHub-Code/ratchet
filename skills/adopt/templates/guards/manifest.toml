# Guard paths (Ratchet method): the single list of files that define, run or record the quality gates.
# Globs are matched against repository-relative paths; `*` stays within a segment, `**` spans any.
# A `~/` pattern matches against the home directory. `edit = "deny"` locks a group: the owner edits
# those files by hand. `edit = "append"` marks records an agent may add to: a new glossary term, a
# new `_Avoid_` item or a new ADR passes, and changing or removing what is there asks the owner.
# The hook, `just guard-diff` and a fitness test all read this file.

[[group]]
name = "tool-config"
reason = "Rule sets, limits and thresholds of every gate: loosening one silently weakens every later check."
paths = [
    # bind: the config files of every gate tool
]

[[group]]
name = "gate-commands"
reason = "The command contract and the scripts that run or score the gates: changing them changes what passing means."
paths = [
    "justfile",
    "scripts/**",
    ".pre-commit-config.yaml",
]

[[group]]
name = "ratchets"
reason = "Recorded thresholds, the mutation register and config snapshots only ever rise."
paths = [
    "quality/**",
]

[[group]]
name = "ci"
reason = "CI config and the pull-request template decide what runs before the owner merges."
paths = [
    ".github/**",
    # bind: the CI config paths of another forge
]

[[group]]
name = "harness"
reason = "Settings, hooks and workflows and this manifest enforce the guards; changing them can switch the guards off, so the owner edits them by hand."
edit = "deny"
paths = [
    # Listed, not `.claude/**`: `just settings` mirrors every pattern as a permission rule, and a
    # rule cannot exclude the agent worktrees under .claude/worktrees/ as a group's `exclude` can.
    ".claude/settings.json",
    ".claude/settings.local.json",
    ".claude/hooks/**",
    ".claude/workflows/**",
    ".claude/agents/**",
    ".claude/skills/**",
    ".claude/commands/**",
    ".claude/rules/**",
    "guards/**",
    "~/.claude/settings.json",
    "~/.claude/settings.local.json",
]

[[group]]
name = "local-git"
reason = "Git hooks and repository config run the tier 0 gates on every commit; only the hook can see them."
edit = "deny"
paths = [
    ".git/hooks/**",
    ".git/config",
]

[[group]]
name = "fitness"
reason = "Architectural fitness tests encode the ADRs as executable checks."
paths = [
    # bind: the fitness test directories
]

[[group]]
name = "gate-tools"
reason = "Home-grown checkers behind the gates."
paths = [
    # bind: tools/ directories that implement gates
]

[[group]]
name = "formal"
reason = "Formal models and the project-local verification skill are the design the code must mirror."
paths = [
    "formal/**",
    # bind: the project-local verification skill, e.g. .claude/skills/<area>/**
]

[[group]]
name = "records"
reason = "The ADRs and the vocabulary are standards every review judges against: an agent adds a term, an Avoid item or a new ADR, and what is already there changes by the owner's hand."
edit = "append"
paths = [
    "docs/adr/**",
    "GLOSSARY.md",
]

[[group]]
name = "decisions"
reason = "The agent instructions, the glossary map, the design records, the process documents and the skills' records (tracker, labels, doc layout) are the standards every review judges against."
paths = [
    "docs/agents/**",
    "docs/process/**",
    "AGENTS.md",
    "CLAUDE.md",
    "GLOSSARY-MAP.md",
    "PRODUCT.md",
    "DESIGN.md",
]
