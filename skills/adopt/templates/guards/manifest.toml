# Guard paths (Ratchet method): the single list of files that define, run or record the quality gates.
# Globs are matched against repository-relative paths; `*` stays within a segment, `**` spans any.
# A `~/` pattern matches against the home directory. Edit-time control stays for exactly the files
# whose effect comes before the merge; everything else is judged at merge. On a branch an agent
# changes a guard path with no prompt: the merge judge reads the change and sends it to the owner.
# Where the commit would land on the default branch the hook refuses it, since no judge reads that.
# `edit = "deny"` locks a group the owner edits by hand. Two kinds of file act before any merge and
# need no group here: the hook asks the owner before each write it reads of a CI workflow (a file
# directly under `.github/workflows/`) or of an agent-instruction file at any depth (`CLAUDE.md`,
# `CLAUDE.local.md`, `AGENTS.md`, `GEMINI.md`, anything under a `.claude/` directory), on every
# branch. `edit = "append"` marks records an agent may add to: on the default branch a new glossary
# term, a new `_Avoid_` item or a new ADR still passes. The hook, the merge judge, `just guard-diff`
# and a fitness test read this file as the default branch holds it. Once it is there, an agent only
# adds to it, with an Edit or Write on a branch: a path after the others in a group's or a door's
# `paths`, or a whole `[[group]]` or `[[door]]` after the ones here. A path that also matches a
# pattern of a group below it, and any other change, is the owner's. If the
# default branch loses this file, the hook locks every path its last version named until the owner
# puts it back. The hook is a check on ordinary writes, not a boundary (ADR 0033).

[[group]]
name = "tool-config"
reason = "Rule sets, limits and thresholds of every gate: loosening one silently weakens every later check."
paths = [
    # bind: the config files of every gate tool
]

[[group]]
name = "gate-commands"
reason = "The command contract and the scripts that run or score the gates: changing them changes what passing means."
paths = [
    "justfile",
    "scripts/**",
    ".pre-commit-config.yaml",
]

[[group]]
name = "ratchets"
reason = "Recorded thresholds, the mutation register and config snapshots only ever rise."
paths = [
    "quality/**",
]

[[group]]
name = "ci"
reason = "CI config and the pull-request template decide what runs before a change merges, and the merge job is the one agent path to the default branch."
paths = [
    ".github/**",
    # bind: the CI config paths of another forge
]

[[group]]
name = "harness"
reason = "Settings, hooks, workflows, agents, skills and commands enforce the guards and act in any session started in the checkout that holds them, before a merge; changing them can switch the guards off, so the owner edits them by hand."
edit = "deny"
paths = [
    ".claude/settings.json",
    ".claude/settings.local.json",
    ".claude/hooks/**",
    ".claude/workflows/**",
    ".claude/agents/**",
    ".claude/skills/**",
    ".claude/commands/**",
    "~/.claude/settings.json",
    "~/.claude/settings.local.json",
]

[[group]]
name = "manifest"
reason = "This file says what a guard path and a one-way door are; the hook and the merge judge read it as the default branch holds it, so a change acts only once the owner merges it."
paths = [
    "guards/**",
]

[[group]]
name = "local-git"
reason = "Git hooks and repository config run the tier 0 gates on every commit, and the refs, HEAD, grafts and object-store pointers are what the path guards read the default branch through; none is versioned, so only the hook can see them."
edit = "deny"
paths = [
    ".git/hooks/**",
    ".git/config",
    ".git/refs",
    ".git/refs/**",
    ".git/packed-refs",
    ".git/HEAD",
    ".git/info/grafts",
    ".git/shallow",
    ".git/objects/info",
    ".git/objects/info/**",
]

[[group]]
name = "fitness"
reason = "Architectural fitness tests encode the ADRs as executable checks."
paths = [
    # bind: the fitness test directories
]

[[group]]
name = "gate-tools"
reason = "Home-grown checkers behind the gates."
paths = [
    # bind: tools/ directories that implement gates
]

[[group]]
name = "formal"
reason = "Formal models and the project-local verification skill are the design the code must mirror."
paths = [
    "formal/**",
    # bind: the project-local verification skill, e.g. .claude/skills/<area>/**
]

[[group]]
name = "records"
reason = "The ADRs and the vocabulary are standards every review judges against: an agent adds a term, an Avoid item or a new ADR, and what is already there changes by the owner's hand."
edit = "append"
paths = [
    "docs/adr/**",
    "GLOSSARY.md",
]

[[group]]
name = "decisions"
reason = "The agent instructions, the glossary map, the design records, the process documents and the skills' records (tracker, labels, doc layout) are the standards every review judges against."
paths = [
    "docs/agents/**",
    "docs/process/**",
    ".claude/rules/**",
    "AGENTS.md",
    "CLAUDE.md",
    "GLOSSARY-MAP.md",
    "PRODUCT.md",
    "DESIGN.md",
]

# One-way doors: paths whose change cannot be taken back once it ships. A door is no guard: an
# agent edits these paths without a prompt. The merge judge (`just merge-ready`) reads the doors,
# and a change that goes through one waits for the owner. `on` says what shuts a door: "change"
# is any change, "rewrite" a change to or deletion of a file the default branch holds, "removal"
# a deletion or a change that does more than add. An addition behind a "removal" door is new
# surface: it merges without the owner only when the change also declares or names a flag that is
# off (`unflagged`, ADR 0025 of the plugin). A door this repository has no path for keeps
# `paths = []` and says why: `none = "<the reason>"`.

[[door]]
name = "one-way"
reason = "A migration, a schema change or an infrastructure change cannot be taken back once it has run."
paths = [
    # bind: migrations, schema definitions, infrastructure code
]

[[door]]
name = "stored-data"
reason = "Fixtures of data that earlier versions wrote: rewriting one hides that old data no longer loads."
on = "rewrite"
paths = [
    # bind: the golden fixtures the data-compat gate loads
]

[[door]]
name = "contracts"
reason = "Contract artefacts and public-surface snapshots: a line removed is a consumer broken."
on = "removal"
paths = [
    # bind: the artefacts the contracts-check and api-check gates diff
]
