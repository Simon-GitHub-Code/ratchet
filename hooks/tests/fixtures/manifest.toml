# Test fixture: a guard manifest with the shape a repository on the Ratchet method uses.
# The corpus and property tests in this directory pin the guard's behaviour against it.
[[group]]
name = "tool-config"
reason = "Rule sets, limits and thresholds of every gate: loosening one silently weakens every later check."
paths = [
    "config/lint.toml",
    "app/core/lint.toml",
    "config/types*.json",
    "config/format.json",
    "config/test.config.ts",
    "config/mutation.config.mjs",
    "config/dead-code.*",
    "config/e2e.config.ts",
    "web/package.json",
]

[[group]]
name = "gate-commands"
reason = "The command contract and the scripts that run or score the gates: changing them changes what passing means."
paths = [
    ".pre-commit-config.yaml",
    "justfile",
    "scripts/**",
    "app/scripts/**",
    "web/scripts/**",
]

[[group]]
name = "ratchets"
reason = "Recorded thresholds, mutation registers and config snapshots only ever rise."
paths = [
    "quality/**",
    "app/thresholds.toml",
]

[[group]]
name = "ci"
reason = "Workflows, the PR template and Dependabot decide what GitHub runs before the owner merges."
paths = [
    ".github/**",
]

[[group]]
name = "harness"
reason = "Claude Code settings, hooks and workflows and this manifest enforce the guards; changing them can switch the guards off, so the owner edits them by hand."
edit = "deny"
exclude = [".claude/worktrees", ".claude/worktrees/**"]
paths = [
    ".claude/**",
    "guards/**",
    "tools/guards/**",
    "~/.claude/settings.json",
    "~/.claude/settings.local.json",
]

[[group]]
name = "guard-tests"
reason = "The guard's own corpus and properties pin what the harness blocks."
paths = [
    "tests/guards/**",
]

[[group]]
name = "local-git"
reason = "Git hooks and repository config run the tier 0 gates on every commit; they are not versioned, so only the hook can see them."
edit = "deny"
paths = [
    ".git/hooks/**",
    ".git/config",
]

[[group]]
name = "fitness"
reason = "Architectural fitness tests encode the decision records as executable checks."
paths = [
    "tests/fitness/**",
    "web/src/fitness/**",
]

[[group]]
name = "gate-tools"
reason = "Home-grown checkers behind the complexity, comment and conformance gates."
paths = [
    "tools/gates/**",
]

[[group]]
name = "formal"
reason = "Formal specs are the design that code must conform to."
paths = [
    "formal/**",
]

[[group]]
name = "records"
reason = "Decision records and the vocabulary: an agent adds to them, the owner changes them."
edit = "append"
paths = [
    "docs/adr/**",
    "GLOSSARY.md",
]

[[group]]
name = "decisions"
reason = "The agent instructions and the process documents are the standards every review judges against."
paths = [
    "docs/agents/**",
    "docs/process/**",
    "CLAUDE.md",
]
