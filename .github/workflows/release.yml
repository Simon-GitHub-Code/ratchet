name: release
on:
  push:
    branches: [main]
    paths: [.claude-plugin/plugin.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: tag
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then made="$(python3 scripts/release.py --existing)"; else made="$(python3 scripts/release.py)"; fi
          echo "$made"
          case "$made" in
            created*) made="${made#created }"; echo "name=${made%% *}" >> "$GITHUB_OUTPUT"; echo "fresh=true" >> "$GITHUB_OUTPUT" ;;
            exists*) echo "name=${made#exists }" >> "$GITHUB_OUTPUT" ;;
          esac
      - if: steps.tag.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          FRESH: ${{ steps.tag.outputs.fresh }}
        run: |
          set -euo pipefail
          tag="$TAG"
          python3 scripts/release.py --notes "${tag#v}" > "$RUNNER_TEMP/notes.md"
          if [ "$FRESH" = "true" ]; then
            python3 scripts/release_check.py "$tag" --local --main HEAD
            git push origin "refs/tags/$tag"
          fi
          git fetch --quiet --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          python3 scripts/release_check.py "$tag"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "release page for $tag exists; left alone"
            exit 0
          fi
          gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
