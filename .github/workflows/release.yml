name: release
on:
  push:
    branches: [main]
    paths: [.claude-plugin/plugin.json]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - id: tag
        run: |
          made="$(python3 scripts/release.py)"
          echo "$made"
          case "$made" in
            created*) made="${made#created }"; echo "name=${made%% *}" >> "$GITHUB_OUTPUT"; echo "fresh=true" >> "$GITHUB_OUTPUT" ;;
            exists*) echo "name=${made#exists }" >> "$GITHUB_OUTPUT" ;;
          esac
      - if: steps.tag.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          FRESH: ${{ steps.tag.outputs.fresh }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if [ "$FRESH" = "true" ]; then git push origin "$tag"; fi
          python3 scripts/release_check.py "$tag" --main origin/main
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "release page for $tag exists; left alone"
            exit 0
          fi
          python3 scripts/release.py --notes "${tag#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
