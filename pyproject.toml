[project]
name = "ratchet"
version = "0.12.4"
description = "The Ratchet method as a Claude Code plugin: harness-enforced guards on the quality gates."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "coverage>=7.6",
    "hypothesis>=6.115",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.coverage.run]
branch = true
source = ["scripts", "hooks", "evals/first-hour/first_hour"]
omit = ["*/hooks/tests/*", "*/evals/first-hour/first_hour/drive.py"]
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["hooks/tests", "evals/first-hour/tests"]
pythonpath = ["hooks", "scripts", "evals/first-hour"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["hooks", "scripts", "evals/first-hour"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "COM812",
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
"hooks/guard.py" = [
    "INP001",
]
"hooks/session.py" = [
    "INP001",
    "T201",
]
"hooks/ratchet_guards/session.py" = [
    "T201",
]
"hooks/tests/test_session.py" = [
    "S603",
]
"hooks/ratchet_guards/diff.py" = [
    "T201",
]
"scripts/*.py" = [
    "T201",
    "S603", "S607",
    "INP001",
]
"evals/first-hour/run.py" = [
    "T201",
    "S603",
    "INP001",
]
"evals/first-hour/first_hour/*.py" = [
    "S603", "S607",
    "S108",
]
"evals/first-hour/tests/**" = [
    "INP001",
    "S101",
    "S603", "S607",
    "S108",
    "ARG002",
    "PLR2004",
]
"hooks/tests/**" = [
    "S101",
    "PLR2004",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-returns = 6
max-args = 5
max-positional-args = 3
max-statements = 40

[tool.ruff.lint.isort]
known-first-party = ["ratchet_guards", "tests", "guard", "first_hour"]

[tool.mypy]
files = ["hooks"]
python_version = "3.11"
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "truthy-bool", "redundant-expr"]
