[project]
name = "ratchet"
version = "0.6.0"
description = "The Ratchet method as a Claude Code plugin: harness-enforced guards on the quality gates."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "coverage>=7.6",
    "hypothesis>=6.115",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

# Why: the plugin is hooks, skills and workflows, not an installable package.
[tool.uv]
package = false

# Why: the gate scripts are the method's own checkers; a line of them nobody ran is a gate that
# may never fire, so they are held at 100% by the tool, not by a number that could be lowered.
[tool.coverage.run]
branch = true
source = ["scripts"]
omit = ["scripts/conformance.py", "scripts/budget.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["hooks/tests"]
pythonpath = ["hooks", "scripts"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["hooks", "scripts"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # one-blank-line-before-class: conflicts with D211 (no-blank-line-before-class)
    "D213",   # multi-line-summary-second-line: conflicts with D212 (summary on first line)
    "COM812", # missing-trailing-comma: conflicts with the formatter, which owns commas
    "CPY001", # copyright notice: private single-owner repository, no header policy
]

[tool.ruff.lint.per-file-ignores]
"hooks/guard.py" = [
    "INP001", # the shim is a standalone script, deliberately not a package
]
"hooks/session.py" = [
    "INP001", # the shim is a standalone script, deliberately not a package
    "T201",   # the hook reports context to stdout by design
]
"hooks/ratchet_guards/session.py" = [
    "T201", # the hook reports context to stdout by design
]
"hooks/tests/test_session.py" = [
    "S603", # subprocess runs the shim with a literal argv list, no shell
]
"hooks/ratchet_guards/diff.py" = [
    "T201", # the diff tool reports to stdout by design
]
"scripts/*.py" = [
    "T201",   # the gate scripts report to stdout by design
    "D103",   # docstrings are required only in core layers; the module docstring carries the contract
    "S603", "S607", # subprocess runs git with a literal argv list, no shell
    "INP001", # standalone scripts, deliberately not a package
]
"hooks/tests/**" = [
    "S101",    # assert is the test idiom
    "PLR2004", # magic numbers are the test fixtures
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]

[tool.ruff.lint.mccabe]
max-complexity = 10 # C901

[tool.ruff.lint.pylint]
max-branches = 12        # PLR0912
max-returns = 6          # PLR0911
max-args = 5             # PLR0913
max-positional-args = 3  # PLR0917
max-statements = 40      # PLR0915

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["ratchet_guards", "tests", "guard"]

[tool.mypy]
files = ["hooks"]
python_version = "3.11"
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "truthy-bool", "redundant-expr"]
